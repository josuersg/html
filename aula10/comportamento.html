<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="../favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="shortcut icon" href="../favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
  <link rel="manifest" href="../site.webmanifest" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Grão Dourado — Comportamento</title>
  <link rel="stylesheet" href="comportamento.css">

</head>
<body>

  <main>
    <h1>☕ Cardápio</h1>

    <div class="card">
      <h4>Espresso</h4>
      <p>Café curto e intenso.</p>
      <span class="preco">R$ 6,00</span>
      <button type="button" class="botao">Pedir</button>
    </div>

    <div class="card">
      <h4>Cappuccino</h4>
      <p>Café, leite vaporizado e canela.</p>
      <span class="preco">R$ 9,50</span>
      <button type="button" class="botao">Pedir</button>
    </div>

    <div class="card">
      <h4>Bolo de cenoura</h4>
      <p>Volta amanhã!</p>
      <span class="preco">R$ 7,00</span>
      <button type="button" class="botao" disabled>Esgotado</button>
    </div>

    <form class="contato">
      <h2>Receba nossas promoções</h2>
      <label for="email">Seu e-mail</label>
      <input type="email" id="email" class="campo" placeholder="voce@email.com">
      <button type="submit" class="botao">Quero receber</button>
    </form>
  </main>

   <a href="../index.html"><button style="background-color: #f0f5fc; color: #105391; border: 3px solid #105391; border-radius: 20px; width: 60px; height: 33px;">Voltar</button></a>
   
</body>
</html>
